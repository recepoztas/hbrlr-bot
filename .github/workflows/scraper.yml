name: Haber Botu Otomasyonu

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
         python -m pip install --upgrade pip
         python -m pip install feedparser requests beautifulsoup4 groq supabase

      - name: Botu Çalıştır
        env:
         SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
         SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
         GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py


